<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rudra Goti | Resume Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f1419;
    --card: #161d25;
    --line: #26313d;
    --text: #e6edf3;
    --muted: #8a98a8;
    --amber: #f2b84b;
    --teal: #4fd1c5;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--sans); }
  body { padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); line-height: 1.6; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 48px 0 32px; }
  a { color: var(--teal); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  /* Hero */
  .hero { padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1.05; margin: 0 0 12px; font-weight: 700; letter-spacing: -0.02em; }
  .title { color: var(--teal); font-size: 1.05rem; font-weight: 500; margin: 0 0 14px; }
  .summary { color: var(--muted); margin: 0; max-width: 70ch; }

  /* Horizontal contact row */
  .contact { display: flex; flex-wrap: wrap; gap: 12px 28px; margin-top: 24px; }
  .contact-item { min-width: 0; }
  .contact-item .label { display: block; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
  .contact-item .value { font-family: var(--mono); font-size: 0.88rem; color: var(--text); overflow-wrap: anywhere; }
  .contact-item .value.empty { color: var(--muted); font-style: italic; }

  /* Sections */
  section { margin-top: 48px; }
  h2 { font-size: 1.2rem; font-weight: 600; margin: 0 0 18px; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* Experience & projects */
  .item { border-left: 2px solid var(--line); padding: 0 0 22px 18px; position: relative; }
  .item::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--teal); }
  .item h3 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .item .org { color: var(--muted); }
  .meta { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin: 4px 0 10px; }
  .item ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
  .item li + li { margin-top: 4px; }
  .item p { color: var(--muted); margin: 6px 0 0; }
  .projects { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }

  /* Horizontal auto-scrolling strips (skills and certificates) */
  .hticker {
    overflow: hidden;
    position: relative;
    padding: 14px 0;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .htrack { display: flex; width: max-content; animation: scroll-x var(--dur, 20s) linear infinite; }
  .hticker:hover .htrack, .hticker:focus-within .htrack { animation-play-state: paused; }
  .hcopy { display: flex; gap: 12px; padding-right: 12px; }
  @keyframes scroll-x { to { transform: translateX(-50%); } }

  .hcard {
    display: flex; align-items: center; gap: 12px; white-space: nowrap;
    padding: 10px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  .hcard.cert { flex-direction: column; align-items: flex-start; gap: 10px; width: 260px; white-space: normal; }
  .logo {
    width: 36px; height: 36px; flex: none; border-radius: 9px;
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: 0.02em;
    color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
  }
  .cert-logo { background: #2b3644; color: var(--amber); }
  .card-name { font-weight: 500; font-size: 0.95rem; }
  .card-sub { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }

  /* Education */
  .cert-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .cert-row:first-child { padding-top: 0; }
  .cert-row strong { font-weight: 600; }
  .cert-row .meta { margin: 2px 0 0; }
  .empty { color: var(--muted); font-style: italic; }

  /* Footer */
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 0.85rem; }
  .upload { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  .upload:hover { border-color: var(--teal); }
  .error { color: #ff7b72; font-family: var(--mono); font-size: 0.82rem; }

  @media (max-width: 720px) {
    .projects { grid-template-columns: 1fr; }
    .wrap { padding-top: 32px; }
    .hcard.cert { width: 220px; }
  }
  /* Reduced motion: stop auto-scroll and let the user scroll the strip by hand */
  @media (prefers-reduced-motion: reduce) {
    .htrack { animation: none; }
    .hticker { overflow-x: auto; -webkit-mask-image: none; mask-image: none; }
    .hcopy + .hcopy { display: none; }
  }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<footer class="wrap" style="padding-top:20px">
  <span>Rendered from resume data. Load another resume as JSON below.</span>
  <label class="upload">
    Load resume JSON
    <input type="file" id="fileInput" accept="application/json,.json" hidden>
  </label>
  <div class="error" id="err" role="alert"></div>
</footer>

<script>
// ----- Resume data: edit here, or load a JSON file with the same shape -----
const RESUME = {
  name: "Rudra Goti",
  title: "Cybersecurity Analyst | Network Penetration Testing | Ethical Hacking",
  summary: "Conducted security research and threat analysis to identify potential vulnerabilities, understand attack vectors, assess security risks, and explore mitigation strategies to strengthen system security.",
  contact: {
    email: { value: "rudragoti.work@gmail.com", url: "mailto:rudragoti.work@gmail.com" },
    location: { value: "Surat, Gujarat" },
    linkedin: { value: "rudra-goti-47b29339b", url: "https://www.linkedin.com/in/rudra-goti-47b29339b" },
    tryhackme: { value: "", url: "" },   // add profile link, e.g. https://tryhackme.com/p/yourname
    hackthebox: { value: "", url: "" }   // add profile link, e.g. https://app.hackthebox.com/users/123456
  },
  experience: [
    {
      role: "Cyber Security Analyst",
      company: "Deloitte",
      period: "12/2025 - 01/2026",
      location: "Surat, India",
      summary: "Learned VAPT and how real security operations are performed in industry, focused on finding and mitigating system vulnerabilities and threats.",
      highlights: [
        "Learned to identify digital assets and map network components.",
        "Understood how to find and document common security weaknesses in systems.",
        "Evaluated the severity of issues to help prioritize fixes."
      ]
    }
  ],
  projects: [],
  education: [
    {
      degree: "Bachelor of Technology in Computer Science and Engineering - Cyber Security",
      school: "Parul University (Vadodara, Gujarat)",
      institution: "Parul Institute of Engineering and Technology",
      period: "08/2023 - Present",
      cgpa: 7.33,
      maxCgpa: 10
    }
  ],
  skills: [
    "Penetration Testing", "Vulnerability Management", "Nessus", "Web Application Security Testing",
    "Metasploit", "Burp Suite", "OWASP Top 10", "OWASP ZAP", "Nmap", "Report Writing",
    "Cryptography", "Kali Linux", "Cloud Security", "Shodan"
  ],
  certificates: [
    { name: "Cryptography And Network Security", issuer: "NPTEL", date: "04/2025" },
    { name: "Cybersecurity Foundation", issuer: "Palo Alto Networks", date: "08/2025" },
    { name: "POINTER OVERFLOW CTF", issuer: "University of Wisconsin-Stevens Point", date: "10/2026" },
    { name: "Deloitte Cyber Job Simulation", issuer: "Palo Alto Networks", date: "08/2025" },
    { name: "Oracle Cloud Infrastructure 2025 Certified AI Foundations Associate", issuer: "Palo Alto Networks", date: "08/2025" }
  ]
};

// Brand colour and short mark for known skills. Unknown skills get a generated tile.
const SKILL_BRANDS = {
  "Penetration Testing":              { bg: "#b3261e", mark: "PT" },
  "Vulnerability Management":         { bg: "#7a3e9d", mark: "VM" },
  "Nessus":                           { bg: "#00a3e0", mark: "Ns" },
  "Web Application Security Testing": { bg: "#1f6feb", mark: "WA" },
  "Metasploit":                       { bg: "#2a6fb0", mark: "MS" },
  "Burp Suite":                       { bg: "#e8612c", mark: "Bs" },
  "OWASP Top 10":                     { bg: "#f0a30a", mark: "10", fg: "#111" },
  "OWASP ZAP":                        { bg: "#0a6fb4", mark: "ZP" },
  "Nmap":                             { bg: "#4a7fb5", mark: "Nm" },
  "Report Writing":                   { bg: "#5b6b7c", mark: "RW" },
  "Cryptography":                     { bg: "#6e59c7", mark: "CR" },
  "Kali Linux":                       { bg: "#367bbd", mark: "K" },
  "Cloud Security":                   { bg: "#0f9d8a", mark: "CS" },
  "Shodan":                           { bg: "#c8102e", mark: "SH" }
};

// ----- Helpers -----
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const isSafeUrl = (u) => /^(https?:\/\/|mailto:)/i.test(String(u || ""));

// Generated tile for skills not in SKILL_BRANDS: a stable colour from the name
function brandFor(name) {
  if (SKILL_BRANDS[name]) return SKILL_BRANDS[name];
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const words = String(name).trim().split(/\s+/);
  const mark = (words.length > 1 ? words[0][0] + words[1][0] : words[0].slice(0, 2)).toUpperCase();
  return { bg: `hsl(${h % 360} 55% 40%)`, mark };
}

// A horizontal auto-scrolling strip. Items are duplicated so the loop is seamless.
function hstrip(cardsHtml, count, speedPerItem = 3) {
  const copy = `<div class="hcopy">${cardsHtml}</div>`;
  const dur = Math.max(14, count * speedPerItem);
  return `
    <div class="hticker" style="--dur:${dur}s" tabindex="0" aria-label="Scrolling list">
      <div class="htrack">${copy}${copy}</div>
    </div>`;
}

// ----- Render -----
function render(r) {
  const c = r.contact || {};
  const skills = r.skills || [];
  const certs = r.certificates || [];
  const edu = r.education || [];
  const exp = r.experience || [];
  const projects = r.projects || [];

  // Contact row: fixed order, horizontal. Missing values show a placeholder.
  const contactItems = [
    ["Email", c.email],
    ["Location", c.location],
    ["LinkedIn", c.linkedin],
    ["TryHackMe", c.tryhackme],
    ["HackTheBox", c.hackthebox]
  ].map(([label, item]) => {
    const value = item && item.value ? item.value : "";
    let valueHtml;
    if (value && isSafeUrl(item.url)) {
      valueHtml = `<a class="value" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(value)}</a>`;
    } else if (value) {
      valueHtml = `<span class="value">${esc(value)}</span>`;
    } else {
      valueHtml = `<span class="value empty">Add link</span>`;
    }
    return `<div class="contact-item"><span class="label">${esc(label)}</span>${valueHtml}</div>`;
  }).join("");

  const hero = `
    <header class="hero">
      <h1>${esc(r.name)}</h1>
      <p class="title">${esc(r.title)}</p>
      <p class="summary">${esc(r.summary)}</p>
      <div class="contact">${contactItems}</div>
    </header>`;

  const experience = exp.length ? exp.map((e) => `
      <div class="item">
        <h3>${esc(e.role)}</h3>
        <div class="org">${esc(e.company)}</div>
        <div class="meta">${esc(e.period)}${e.location ? " | " + esc(e.location) : ""}</div>
        ${e.summary ? `<p>${esc(e.summary)}</p>` : ""}
        ${(e.highlights || []).length ? `<ul>${e.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
      </div>`).join("") : `<p class="empty">No experience added.</p>`;

  const projectsHtml = projects.length ? `
    <section>
      <h2>Projects</h2>
      <div class="projects">
        ${projects.map((p) => `
          <div class="item">
            <h3>${esc(p.name)}</h3>
            ${p.period ? `<div class="meta">${esc(p.period)}</div>` : ""}
            <p>${esc(p.description)}</p>
            ${isSafeUrl(p.url) ? `<p><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">View project</a></p>` : ""}
          </div>`).join("")}
      </div>
    </section>` : "";

  const skillCards = skills.map((s) => {
    const b = brandFor(s);
    return `
      <div class="hcard">
        <div class="logo" style="background:${esc(b.bg)};color:${esc(b.fg || "#fff")}" aria-hidden="true">${esc(b.mark)}</div>
        <div class="card-name">${esc(s)}</div>
      </div>`;
  }).join("");

  const certCards = certs.map((k) => `
      <div class="hcard cert">
        <div class="logo cert-logo" aria-hidden="true">${esc((k.issuer || "C").trim().slice(0, 2).toUpperCase())}</div>
        <div>
          <div class="card-name">${esc(k.name)}</div>
          <div class="card-sub">${esc(k.issuer)} | ${esc(k.date)}</div>
        </div>
      </div>`).join("");

  const eduHtml = edu.length ? edu.map((e) => `
      <div class="cert-row">
        <strong>${esc(e.degree)}</strong>
        <div>${esc(e.school)}</div>
        <div class="meta">${esc(e.institution)}</div>
        <div class="meta">${esc(e.period)}${e.cgpa ? " | CGPA " + esc(e.cgpa) : ""}</div>
      </div>`).join("") : `<p class="empty">No education added.</p>`;

  document.title = `${r.name || "Resume"} | Resume Profile`;
  document.getElementById("app").innerHTML = `
    ${hero}
    <section>
      <h2>Experience</h2>
      ${experience}
    </section>
    ${projectsHtml}
    <section>
      <h2>Skills</h2>
      ${skills.length ? hstrip(skillCards, skills.length, 2.2) : `<p class="empty">No skills added.</p>`}
    </section>
    <section>
      <h2>Certificates</h2>
      ${certs.length ? hstrip(certCards, certs.length, 3.5) : `<p class="empty">No certificates added.</p>`}
    </section>
    <section>
      <h2>Education</h2>
      ${eduHtml}
    </section>`;
}

// ----- Load a different resume from JSON -----
function validate(obj) {
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error("JSON must be an object.");
  if (!obj.name || typeof obj.name !== "string") throw new Error('Missing "name" text.');
  ["skills", "certificates", "experience", "education", "projects"].forEach((k) => {
    if (obj[k] !== undefined && !Array.isArray(obj[k])) throw new Error(`"${k}" must be a list.`);
  });
  return obj;
}

document.getElementById("fileInput").addEventListener("change", (ev) => {
  const err = document.getElementById("err");
  err.textContent = "";
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      render(validate(JSON.parse(reader.result)));
    } catch (e) {
      err.textContent = "Could not load resume: " + e.message;
    }
  };
  reader.onerror = () => { err.textContent = "Could not read the file."; };
  reader.readAsText(file);
  ev.target.value = "";
});

render(RESUME);
</script>
</body>
</html>
